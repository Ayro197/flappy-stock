    direction = -1;
    score = 0;
    peakPrice = START_PRICE;
    segments = [{ x, y, direction }];
    obstacles = [];
    nextObstacleX = 540;
    nextGapY = y;
    gameOver = false;
    choiceBounds = [];
    lastTime = null;
    updateCamera();
    generateObstacles();
  }

  // Source artwork is embedded as transparent PNGs. Repeat a shaft row and
  // draw the original pixel-art tip at the collision boundary, mirrored below.
  function drawObstacleColumn(worldX, boundaryY, upper, event) {
    const img = SPRITES[event.index];
    const left = Math.round(sx(worldX));
    const edge = Math.round(sy(boundaryY));
    const w = Math.round(OBSTACLE_WIDTH * ZOOM);
    const limit = upper ? Math.max(0, edge - hudHeight()) : Math.max(0, height - edge);
    if (!limit || !img.complete || !img.naturalWidth) return;
    const cap = Math.min(Math.round(65 * ZOOM), limit);
    ctx.save();
    ctx.beginPath();
    ctx.rect(left, upper ? hudHeight() : edge, w, limit);
    ctx.clip();
    ctx.imageSmoothingEnabled = false;
    // Use a middle shaft row from the approved source, never a synthetic illustration.
    const shaftRow = Math.max(1, Math.floor(img.naturalHeight * 0.37));
    const shaftWidth = Math.round(w * 0.66);
    const shaftX = left + Math.round((w - shaftWidth) / 2);
    if (limit > cap) ctx.drawImage(img, 0, shaftRow, img.naturalWidth, 2,
      shaftX, upper ? hudHeight() : edge + cap, shaftWidth, limit - cap);
    // The source's bottom tip points down; flip it vertically for lower obstacles.
    const srcCapHeight = Math.min(img.naturalHeight, Math.round(65 * img.naturalWidth / OBSTACLE_WIDTH));
    if (upper) {
      ctx.drawImage(img, 0, img.naturalHeight - srcCapHeight, img.naturalWidth, srcCapHeight,
        left, edge - cap, w, cap);
    } else {
      ctx.translate(0, 2 * edge);
      ctx.scale(1, -1);
      ctx.drawImage(img, 0, img.naturalHeight - srcCapHeight, img.naturalWidth, srcCapHeight,
        left, edge - cap, w, cap);
    }
    ctx.restore();
  }

  function drawObstacles() {
    for (const obstacle of obstacles) {
      const left = sx(obstacle.x);
      if (left > playWidth() || left + OBSTACLE_WIDTH * ZOOM < 0) continue;
      const upperY = obstacle.gapY - GAP_HEIGHT / 2;
      const lowerY = obstacle.gapY + GAP_HEIGHT / 2;
      drawObstacleColumn(obstacle.x, upperY, true, obstacle.event);
      drawObstacleColumn(obstacle.x, lowerY, false, obstacle.event);
      const upper = sy(upperY), lower = sy(lowerY);
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = obstacle.event.color;
      if (upper > hudHeight() + 18 || lower < height - 18) {
        ctx.fillText(obstacle.event.name, Math.round(left + OBSTACLE_WIDTH * ZOOM / 2),
          upper > hudHeight() + 18 ? upper - 12 : lower + 12, 130);
      }
    }
  }

  function drawPriceScale() {
    const left = Math.max(0, width - SCALE_WIDTH);
    const currentPrice = priceAt(y);
    const step = 10;
    ctx.fillStyle = '#1b202c';
    ctx.fillRect(left, 0, width - left, height);
    ctx.strokeStyle = '#363c49';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(left + 0.5, 0);
    ctx.lineTo(left + 0.5, height);
    ctx.stroke();
    ctx.font = '12px monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const topPrice = priceAt(cameraY);
    const bottomPrice = priceAt(cameraY + viewHeight() / ZOOM);
    for (let price = Math.ceil(bottomPrice / step) * step; price <= topPrice; price += step) {
      const levelY = sy(originY - (price - START_PRICE) / PRICE_PER_PIXEL);
      if (levelY < hudHeight() || levelY > height) continue;
      ctx.strokeStyle = '#363c49';
      ctx.beginPath();
      ctx.moveTo(left, levelY + 0.5);
      ctx.lineTo(left + 7, levelY + 0.5);
      ctx.stroke();
      ctx.fillStyle = '#a5adbd';
      ctx.fillText(price.toFixed(2), width - 8, levelY);
    }
    const markerY = sy(y);
    const color = direction === -1 ? UP : DOWN;
    ctx.strokeStyle = color;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(0, markerY);
    ctx.lineTo(left, markerY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color;
    ctx.fillRect(left, markerY - 13, width - left, 26);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Arial, sans-serif';
    ctx.fillText(currentPrice.toFixed(2), width - 8, markerY);
  }

  function drawHUD() {
    const area = playWidth(), compact = area < 490;
    const h = hudHeight();
    ctx.fillStyle = '#101a2c'; ctx.fillRect(0, 0, area, h);
    ctx.strokeStyle = '#26d7da'; ctx.lineWidth = 1;
    ctx.strokeRect(1.5, 1.5, area - 3, h - 3);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#eaf5ff'; ctx.font = 'bold 15px monospace';
    ctx.fillText('FLAPPY STOCK', 10, 17, Math.max(1, area - (compact ? 88 : 20)));
    ctx.fillStyle = mode === 'MOON' ? '#ff6eb7' : '#f5c95c';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(MODES[mode].label, compact ? 10 : 162, compact ? 32 : 17, area - 18);
    const price = priceAt(y);
    const fields = [
      ['SCORE', String(score), '#f2f5fa'],
      ['BEST SCORE', String(records[mode].score), '#f5c95c'],
      ['CURRENT PRICE', '$' + price.toFixed(2), UP],
      ['PEAK PRICE', '$' + peakPrice.toFixed(2), '#52d9f4'],
      ['RETURN', returnText(price), returnColor(price)]
    ];
    const cols = compact ? 3 : 5;
    const rowH = compact ? 34 : 44;
    const top = compact ? 47 : 30;
    const cell = area / cols;
    fields.forEach(([label, value, color], i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const px = col * cell + (compact ? 4 : 8), py = top + row * rowH;
      ctx.fillStyle = '#91a1b8'; ctx.font = (compact ? '8px' : '9px') + ' monospace';
      ctx.fillText(label, px, py, Math.max(1, cell - 7));
      ctx.fillStyle = color; ctx.font = 'bold ' + (compact ? 12 : 13) + 'px monospace';
      ctx.fillText(value, px, py + 15, Math.max(1, cell - 7));
    });
    ctx.textAlign = 'right'; ctx.fillStyle = '#7c93aa'; ctx.font = '10px monospace';
    ctx.fillText('FPS ' + fps, area - 9, 16);
  }

  function drawChoiceButtons(top) {
    const area = Math.max(1, width - SCALE_WIDTH);
    const cx = area / 2;
    const bw = Math.min(230, Math.max(120, area - 22));
    const bh = Math.max(44, Math.min(52, height * 0.08));
    const spacing = Math.max(6, Math.min(12, height * 0.015));
    choiceBounds = [];
    [['NORMAL', '[1] NORMAL'], ['MOON', '[2] TO THE MOON 🚀']].forEach(([key, label], i) => {
      const y0 = top + i * (bh + spacing);
      const bounds = { mode: key, left: cx - bw / 2, top: y0, right: cx + bw / 2, bottom: y0 + bh };
      choiceBounds.push(bounds);
      ctx.fillStyle = i === 0 ? '#1d6678' : '#813e70';
      ctx.fillRect(bounds.left, bounds.top, bw, bh);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold ' + (area < 260 ? 12 : 14) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, cx, y0 + bh / 2, bw - 8);
    });
  }

  function drawMenu() {
    if (state !== 'MENU') return;
    ctx.fillStyle = 'rgba(7, 13, 28, 0.96)';
    ctx.fillRect(0, 0, width, height);
    const cx = (width - SCALE_WIDTH) / 2;
    const top = Math.max(32, height / 2 - 95);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e5e9f0';
    ctx.font = 'bold 26px monospace';
    ctx.fillText('FLAPPY STOCK', cx, top, Math.max(1, width - SCALE_WIDTH - 12));
    ctx.fillStyle = '#a5adbd';
    ctx.font = '12px monospace';
    ctx.fillText('SURVIVE THE MARKET', cx, top + 32, Math.max(1, width - SCALE_WIDTH - 12));
    drawChoiceButtons(top + 58);
  }

  function drawGameOver() {
    if (state !== 'GAME_OVER') return;
    ctx.fillStyle = 'rgba(7, 13, 28, 0.96)';
    ctx.fillRect(0, 0, width, height);
    const cx = Math.max(0, (width - SCALE_WIDTH) / 2);
    const compact = height < 520;
    const lineHeight = compact ? 20 : 28;
    const titleY = Math.max(22, height / 2 - (compact ? 142 : 183));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = DOWN;
    ctx.font = 'bold ' + (width < 370 ? 23 : 30) + 'px monospace';
    ctx.fillText('LIQUIDATED', cx, titleY, Math.max(1, width - SCALE_WIDTH - 12));
    const record = records[mode];
    const values = [
      'DIFFICULTY  ' + MODES[mode].label,
      'FINAL SCORE  ' + score,
      'BEST SCORE  ' + record.score,
      'PEAK PRICE  $' + peakPrice.toFixed(2),
      'FINAL RETURN  ' + returnText(priceAt(y)),
      'HIGHEST PRICE  $' + record.price.toFixed(2)
    ];
    ctx.font = (width < 370 ? '11px' : '14px') + ' monospace';
    values.forEach((line, i) => {
      ctx.fillStyle = i === 4 ? returnColor(priceAt(y)) : '#e5e9f0';
      ctx.fillText(line, cx, titleY + 34 + i * lineHeight, Math.max(1, width - SCALE_WIDTH - 16));
    });
    drawChoiceButtons(Math.max(4, Math.min(height - 116, titleY + 42 + values.length * lineHeight)));
  }

  function drawGrid() {
    ctx.strokeStyle = '#1d3147'; ctx.lineWidth = 1;
    ctx.beginPath();
    const step = GRID * ZOOM;
    const offsetX = ((-cameraX * ZOOM % step) + step) % step;
    for (let gx = offsetX; gx <= playWidth(); gx += step) {
      ctx.moveTo(Math.round(gx) + 0.5, hudHeight());
      ctx.lineTo(Math.round(gx) + 0.5, height);
    }
    const offsetY = ((-cameraY * ZOOM % step) + step) % step;
    for (let gy = hudHeight() + offsetY; gy <= height; gy += step) {
      ctx.moveTo(0, Math.round(gy) + 0.5);
      ctx.lineTo(playWidth(), Math.round(gy) + 0.5);
    }
    ctx.stroke();
  }

  function render() {
    ctx.fillStyle = '#0a1020';
    ctx.fillRect(0, 0, width, height);
    drawGrid();
    if (state !== 'MENU') drawObstacles();
    ctx.save(); ctx.beginPath(); ctx.rect(0, hudHeight(), playWidth(), viewHeight()); ctx.clip();
    ctx.lineWidth = 2.5 * ZOOM;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (let i = 0; i < segments.length; i++) {
      const start = segments[i];
      const end = segments[i + 1] || { x, y };
      if (sx(end.x) < -4 || sx(start.x) > playWidth() + 4) continue;
      ctx.strokeStyle = start.direction === -1 ? UP : DOWN;
      ctx.beginPath();
      ctx.moveTo(sx(start.x), sy(start.y));
      ctx.lineTo(sx(end.x), sy(end.y));
      ctx.stroke();
    }
    ctx.restore();
    drawPriceScale();
    if (state === 'PLAYING') drawHUD();
    drawGameOver();
    drawMenu();
  }

  function frame(timestamp) {
    if (fpsStart === null) fpsStart = timestamp;
    fpsFrames++;
    if (timestamp - fpsStart >= 1000) {
      fps = Math.round(fpsFrames * 1000 / (timestamp - fpsStart));
      fpsFrames = 0; fpsStart = timestamp;
    }
    if (state === 'PLAYING' && lastTime !== null) {
      const dt = Math.max(0, Math.min((timestamp - lastTime) / 1000, 0.05));
      const oldX = x, oldY = y;
      let newX = x + MODES[mode].speed * dt;
      let newY = y + direction * MODES[mode].speed * SLOPE * dt;
      // Clamp at the zero-price boundary before collision checks.
      const zeroY = originY + START_PRICE / PRICE_PER_PIXEL;
      const liquidatedByPrice = newY >= zeroY;
      if (liquidatedByPrice && newY !== oldY) {
        const fraction = (zeroY - oldY) / (newY - oldY);
        newX = oldX + (newX - oldX) * Math.max(0, Math.min(1, fraction));
        newY = zeroY;
      }
      const hit = collides(oldX, oldY, newX, newY);
      x = newX;
      y = newY;
      if (hit || liquidatedByPrice) { gameOver = true; state = 'GAME_OVER'; }
      if (!gameOver) {
        updateStatistics();
        generateObstacles();
      } else {
        // The final price can establish a new peak even on the liquidation frame.
        peakPrice = Math.max(peakPrice, priceAt(y));
        updateRecords();
      }
    }
    lastTime = timestamp;
    updateCamera();
    render();
    requestAnimationFrame(frame);
  }

  function onPointer(event) {
    if (event.isPrimary === false || (event.pointerType === 'mouse' && event.button !== 0)) return;
    event.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const px = event.clientX - rect.left;
    const py = event.clientY - rect.top;
    if (state !== 'PLAYING') {
      const selected = choiceBounds.find(b => px >= b.left && px <= b.right &&
        py >= b.top && py <= b.bottom);
      if (selected) restart(selected.mode);
    } else if (px >= 0 && px < playWidth() && py >= hudHeight() && py < height) {
      toggle();
    }
  }

  canvas.addEventListener('pointerdown', onPointer);
  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
      event.preventDefault();
      if (!event.repeat && state === 'PLAYING') toggle();
      return;
    }
    if (event.repeat || (event.code !== 'Digit1' && event.code !== 'Digit2' &&
        event.code !== 'Numpad1' && event.code !== 'Numpad2')) return;
    if (state !== 'PLAYING') restart(event.code.endsWith('1') ? 'NORMAL' : 'MOON');
  });
  window.addEventListener('resize', resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
    window.visualViewport.addEventListener('scroll', resize);
  }
  window.addEventListener('telegram-webapp-ready', initializeTelegram);
  initializeTelegram();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
